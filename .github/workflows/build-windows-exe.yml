

name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example v1.0.2'
        required: true
        default: 'v1.2.3'
      prerelease:
        description: 'Mark this GitHub Release as a prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
     
      - name: Checkout GUI repo
        uses: actions/checkout@v4
        with:
          path: gui-repo

      
      - name: Checkout Broadcaster repo
        uses: actions/checkout@v4
        with:
          # The upstream broadcaster includes Bedrock 1.26.60 / protocol 2225 support.
          repository: MCXboxBroadcast/Broadcaster
          ref: master
          path: broadcaster

      
      - name: Set up JDK 17 toolchain and JDK 21 runtime
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Broadcaster's build-logic requires 17; the last JDK stays active.
          java-version: |
            17
            21

      
      - name: Build Broadcaster Standalone JAR
        working-directory: broadcaster
        run: |
          ./gradlew.bat :bootstrap-standalone:build --no-daemon "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "=== Looking for standalone JAR ==="
          Get-ChildItem -Recurse -Filter "*.jar" | Where-Object { $_.Name -match "standalone" -or $_.Name -match "Standalone" } | ForEach-Object { Write-Output $_.FullName }

      
      - name: Locate standalone JAR
        id: find-jar
        working-directory: broadcaster
        run: |
          # The shadow/fat JAR is typically in bootstrap/standalone/build/libs/
          $jar = Get-ChildItem -Recurse -Filter "*standalone*all*.jar" | Select-Object -First 1
          if (-not $jar) {
            $jar = Get-ChildItem -Recurse -Filter "*standalone*.jar" -Path "bootstrap/standalone/build/libs" | 
                   Where-Object { $_.Name -notmatch "sources|javadoc" } |
                   Sort-Object Length -Descending |
                   Select-Object -First 1
          }
          if (-not $jar) {
            $jar = Get-ChildItem -Recurse -Filter "*Standalone*.jar" -Path "bootstrap" | 
                   Where-Object { $_.Name -notmatch "sources|javadoc" } |
                   Sort-Object Length -Descending |
                   Select-Object -First 1
          }
          if (-not $jar) {
            Write-Error "Could not find standalone JAR!"
            exit 1
          }
          Write-Output "Found JAR: $($jar.FullName)"
          echo "JAR_PATH=$($jar.FullName)" >> $env:GITHUB_OUTPUT

     
      - name: Prepare package directory
        run: |
          New-Item -ItemType Directory -Force -Path "package/app"
          New-Item -ItemType Directory -Force -Path "package/gui-classes"

          
          Copy-Item "${{ steps.find-jar.outputs.JAR_PATH }}" -Destination "package/app/MCXboxBroadcastStandalone.jar"

         
          Copy-Item "gui-repo/MCXboxBroadcastGUI.java" -Destination "package/"

      
      - name: Compile GUI
        working-directory: package
        run: |
          javac -encoding UTF-8 --release 21 -d gui-classes MCXboxBroadcastGUI.java

      
      - name: Create GUI JAR
        working-directory: package
        run: |
          # Create manifest
          @"
          Main-Class: MCXboxBroadcastGUI
          "@ | Set-Content -Path "MANIFEST.MF" -Encoding ASCII

          
          jar cfm gui-classes/MCXboxBroadcastGUI.jar MANIFEST.MF -C gui-classes .
          Write-Output "GUI JAR created successfully"

      
      - name: Build EXE with jpackage
        working-directory: package
        run: |
          # Create an input directory with both JARs
          New-Item -ItemType Directory -Force -Path "jpackage-input"
          Copy-Item "gui-classes/MCXboxBroadcastGUI.jar" -Destination "jpackage-input/"
          Copy-Item "app/MCXboxBroadcastStandalone.jar" -Destination "jpackage-input/"

          
          jpackage `
            --type app-image `
            --name "MCXboxBroadcast" `
            --app-version "1.0.1" `
            --vendor "MCXboxBroadcast" `
            --description "MCXboxBroadcast - Xbox Live Server Broadcaster with GUI" `
            --input jpackage-input `
            --main-jar MCXboxBroadcastGUI.jar `
            --main-class MCXboxBroadcastGUI `
            --dest output `
            --jlink-options "--strip-debug --no-man-pages --no-header-files" `
            --java-options "-Xms64m" `
            --java-options "-Xmx512m" `
            --win-console

          Write-Output "=== jpackage output ==="
          Get-ChildItem -Recurse output | ForEach-Object { Write-Output $_.FullName }

      - name: Verify bundled runtime and include startup diagnostics
        working-directory: package
        run: |
          $java = Join-Path $PWD "output/MCXboxBroadcast/runtime/bin/java.exe"
          if (-not (Test-Path $java)) { throw "Bundled java.exe is required to launch the broadcaster" }
          & $java -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Java failed to start" }
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "JPACKAGE_DEBUG=true"
          echo Starting MCXboxBroadcast. Close the launcher to finish the log.
          "%~dp0MCXboxBroadcast.exe" > "%~dp0launcher-startup.log" 2>&1
          set "LAUNCH_EXIT=%ERRORLEVEL%"
          echo.
          echo Launcher exit code: %LAUNCH_EXIT%
          type "%~dp0launcher-startup.log"
          echo.
          echo Diagnostic log: "%~dp0launcher-startup.log"
          pause
          exit /b %LAUNCH_EXIT%
          '@ | Set-Content -Path "output/MCXboxBroadcast/Launch-with-diagnostics.cmd" -Encoding ASCII

     
      - name: Create distribution ZIP
        run: |
          Compress-Archive -Path "package/output/MCXboxBroadcast/*" -DestinationPath "MCXboxBroadcast-Windows.zip"
          Write-Output "Distribution ZIP created: MCXboxBroadcast-Windows.zip"
          Write-Output "Size: $((Get-Item 'MCXboxBroadcast-Windows.zip').Length / 1MB) MB"

      
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCXboxBroadcast-Windows
          path: MCXboxBroadcast-Windows.zip
          retention-days: 90

      
      - name: Upload app directory
        uses: actions/upload-artifact@v4
        with:
          name: MCXboxBroadcast-AppImage
          path: package/output/MCXboxBroadcast/
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: MCXboxBroadcast ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: MCXboxBroadcast-Windows.zip
